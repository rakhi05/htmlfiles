<html>
<head>
  <title>Audio and Video</title>
</head>
<body style="margin:0;">
  <h1 align="center"><u><b>Audio and Video</b></u></h1>
  <div style="width:50%; height:100vh; float:left; background-color:lightpink; text-align:center;">
    <div style="position:relative; top:50%; transform:translateY(-50%);">
      <h3> Audio Clip</h3>
      <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
      </audio>
    </div>
  </div>
  <div style="width:50%; height:100vh; float:right; background-color:lavender; text-align:center;">
    <div style="position:relative; top:50%; transform:translateY(-50%);">
      <h3> Video Clip</h3>
      <video width="300" controls>
        <source src="video.mp4" type="video/mp4">
      </video>
    </div>
  </div>
</body>
</html>
